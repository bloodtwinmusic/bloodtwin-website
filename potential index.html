    <div id="cursor-holder" style="display:none;"><div id="master-cursor" class="type-cursor"></div></div>

<script>
    // --- TIMELINE CONTROLLER ---
    const typeSpeed = 35; 
    let timelineActive = false;
    let returnTrapTriggered = false;
    let polaroidClicked = false;

    const typeText = async (elementId, text, fadePrevId = null) => {
        return new Promise(resolve => {
            const el = document.getElementById(elementId);
            const cursor = document.getElementById('master-cursor');
            
            if(fadePrevId) document.getElementById(fadePrevId).classList.add('faded');
            el.appendChild(cursor);
            
            let i = 0;
            const interval = setInterval(() => {
                const charNode = document.createTextNode(text[i]);
                el.insertBefore(charNode, cursor);
                i++;
                if(i >= text.length) {
                    clearInterval(interval);
                    resolve();
                }
            }, typeSpeed);
        });
    };

    const triggerWakingSequence = () => {
        if(timelineActive) return;
        timelineActive = true;

        setTimeout(() => { document.getElementById('status-led').style.opacity = '1'; }, 500);

        setTimeout(async () => {
            await typeText('line1', '[WE KNOW YOU\'RE HERE].');
            setTimeout(async () => {
                await typeText('line2', '[OBSERVER LOGGED].', 'line1');
                document.getElementById('line2').classList.remove('faded');
            }, 100); // 100ms wait
        }, 1000);

        setTimeout(() => {
            const pol = document.getElementById('polaroid-cta');
            pol.style.opacity = '1';
            pol.style.transition = 'opacity 2s ease-in';
        }, 3000);

        const tiers = { 1: 5500, 2: 7500, 3: 9500, 4: 11500, 5: 13500, 6: 13500, 7: 13500 };
        Object.entries(tiers).forEach(([tier, delay]) => {
            setTimeout(() => {
                const el = document.querySelector(`.nav-tier[data-tier="${tier}"]`);
                if (el) el.classList.add('revealed');
            }, delay);
        });
    };

    window.onload = triggerWakingSequence;

    // --- BLOOD.TWIN THRESHOLD PROTOCOL ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const cta = document.getElementById('polaroid-cta');
    
    if(cta) {
        cta.addEventListener('click', (e) => {
            e.preventDefault();
            polaroidClicked = true;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);
            
            // Industrial Shutter Burst (Combined relay, click, shutter)
            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(6.0, audioCtx.currentTime); // 300% Amplified Gain
            masterGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            masterGain.connect(audioCtx.destination);

            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sawtooth'; osc1.frequency.setValueAtTime(43.65, audioCtx.currentTime);
            osc1.connect(masterGain);

            const osc2 = audioCtx.createOscillator();
            osc2.type = 'square'; osc2.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc2.connect(masterGain);

            osc1.start(); osc2.start();
            osc1.stop(audioCtx.currentTime + 0.3);
            osc2.stop(audioCtx.currentTime + 0.3);

            setTimeout(() => { window.open('https://snd.click/0ifi', '_blank'); }, 150);
        });
    }

    // --- RETURN TRAP (VISIBILITY CHECK) ---
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && polaroidClicked && !returnTrapTriggered) {
            returnTrapTriggered = true;
            document.getElementById('line2').classList.add('faded');
            
            // Dissolve primary logs
            const l1 = document.getElementById('line1');
            const l2 = document.getElementById('line2');
            l1.classList.add('dissolve-out');
            l2.classList.add('dissolve-out');
            
            setTimeout(() => {
                l1.style.display = 'none';
                l2.style.display = 'none';
                
                const l3 = document.getElementById('line3');
                const l4 = document.getElementById('line4');
                l3.style.display = 'block';
                l4.style.display = 'block';
                
                // Execute Return Sequence Typeout
                setTimeout(async () => {
                    await typeText('line3', '[TERMINAL ENGAGED].');
                    
                    setTimeout(async () => {
                        const isDaylight = new Date().getHours() >= 6 && new Date().getHours() < 18;
                        const finalText = isDaylight ? '[ERROR_CODE: DAYLIGHT].' : '[INITIATE: COMPLETE COLLECTION].';
                        
                        await typeText('line4', finalText, 'line3');
                        
                        // Fire rapid-bomb alert phase if dark
                        if(!isDaylight) {
                            l4.classList.add('bomb-flash-link');
                            l4.classList.remove('faded');
                        } else {
                            l4.classList.add('faded');
                        }
                    }, 1000);
                }, 100);
            }, 800); 
        }
    });

    // --- DAYLIGHT ATTRITION CLICKS ---
    const playlistLink = document.getElementById("line4");
    if (playlistLink) {
        playlistLink.addEventListener("click", function(e) {
            const isDaylight = new Date().getHours() >= 6 && new Date().getHours() < 18;
            if (isDaylight) {
                e.preventDefault();
                this.innerHTML = "[ERROR_CODE: DAYLIGHT].<br><RETURN IN DARKNESS>.";
                this.classList.remove('bomb-flash-link');
                this.classList.add('faded');
                this.style.pointerEvents = 'none'; 
                this.style.whiteSpace = 'normal'; 
                this.style.height = 'auto'; 
                this.style.lineHeight = '1.4'; 
                this.removeAttribute("target");
                
                if(typeof gtag === 'function') {
                    gtag('event', 'daylight_rejection', {'event_category': 'funnel', 'event_label': 'spotify_block'});
                }
            }
        });
    }
