name: Paper Lab

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/London"
    - cron: "30 16 * * *"
      timezone: "Europe/London"
  push:
    branches:
      - paper-lab-odds-logger
      - paper-lab-v0.3
      - paper-lab-v0.4-scheduling
      - main
    paths:
      - "paper-lab/**"
      - ".github/workflows/paper-lab.yml"
  pull_request:
    paths:
      - "paper-lab/**"
      - ".github/workflows/paper-lab.yml"
  workflow_dispatch:
    inputs:
      collect_live_odds:
        description: "Run the live paper-only odds collector (uses API credits/tokens)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run zero-credit local tests
        run: python -m unittest paper-lab/test_odds_logger.py

  oddsrelay_preflight:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.collect_live_odds == false) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[quote-check]')) }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify OddsRelay discovery connection
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSRELAY_KEY: ${{ secrets.ODDSRELAY_KEY }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "paper-lab")
          import odds_logger
          odds_logger.require_provider_credentials()
          odds_logger.print_provider_readiness()
          catalogue = odds_logger.oddsrelay_discover_catalogue()
          sports = catalogue["sports"]["data"]
          count = len(sports) if isinstance(sports, list) else len(sports or {})
          now = odds_logger.datetime.now(odds_logger.timezone.utc)
          start, end = odds_logger.default_collection_window(now)
          quotes = odds_logger.oddsrelay_quote_collection_window(start, end)
          summary = odds_logger.summarize_oddsrelay_preflight(catalogue, quotes)
          print(f"OddsRelay catalogue: OK; sports_payload_items={count}")
          print("OddsRelay quote preflight: " + ", ".join(f"{name}={result['status']}" for name, result in summary["quotes"].items()))
          print("OddsRelay token headers: " + ", ".join(f"{name}={result.get('tokens_cost') or '0/free/unspecified'}" for name, result in summary["quotes"].items()))
          estimates = {
              name: odds_logger.oddsrelay_quote_token_estimate(result)
              for name, result in quotes.items()
              if "error" not in result
          }
          print("OddsRelay acquisition estimates: " + ", ".join(f"{name}={estimate if estimate is not None else 'unknown'}" for name, estimate in estimates.items()))
          selected, _ = odds_logger.oddsrelay_select_products_from_quotes(
              quotes, odds_logger.default_oddsrelay_acquisition_products()
          )
          print("OddsRelay policy-selected products: " + (", ".join(selected) or "none"))
          failures = [name for name, result in quotes.items() if "error" in result]
          if failures:
              for name in failures:
                  print(f"OddsRelay {name} diagnostic: {quotes[name].get('error')}: {quotes[name].get('detail', '')}")
              raise SystemExit("OddsRelay quote preflight failed: " + ", ".join(failures))
          if "standard" not in selected:
              standard_quote = quotes.get("standard", {}).get("quote")
              shape = sorted(standard_quote) if isinstance(standard_quote, dict) else type(standard_quote).__name__
              raise SystemExit(f"OddsRelay Standard quote is not policy-selectable; quote shape={shape}")
          PY

  collect:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect_live_odds == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-check]')) }}
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: paper-lab-live-collection
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Paper Lab odds logger
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSRELAY_KEY: ${{ secrets.ODDSRELAY_KEY }}
          ODDS_CREDIT_BUDGET: "10"
          ODDS_CREDIT_RESERVE: "50"
          ODDS_REQUEST_BUDGET: "8"
          ODDS_MARKETS: "h2h,spreads,totals"
          ODDSRELAY_PRODUCTS: "standard"
          ODDSRELAY_TOKEN_BUDGET: "10000"
        run: python paper-lab/odds_logger.py
      - name: Preserve raw and canonical evidence for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: paper-lab-evidence-${{ github.run_id }}
          path: paper-lab/data/raw/*.json.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Archive canonical board outside Git history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_tag="paper-lab-archive-$(date -u +%Y-%m)"
          if ! gh release view "$archive_tag" >/dev/null 2>&1
          then
            gh release create "$archive_tag" --title "Paper Lab archive $(date -u +%Y-%m)" --notes "Durable compressed canonical Paper Lab observations. Raw provider payloads remain short-retention workflow artifacts; integrity manifests remain in Git."
          fi
          gh release upload "$archive_tag" paper-lab/data/raw/unified_*.json.gz --clobber
      - name: Commit snapshot
        run: |
          git config user.name "Paper Lab Bot"
          git config user.email "paper-lab@users.noreply.github.com"
          git add paper-lab/data/ ':!paper-lab/data/raw/'
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "Paper Lab odds snapshot"
            git push
          fi
