      display: flex; flex-direction: column; gap: 4px;

  .log-entry { margin: 0; opacity: 1; }

  .exposure-flash {

      cursor: pointer;

<script>
document.addEventListener("DOMContentLoaded", () => {
    // SYSTEM COMPONENTS
    const body = document.body;
    const logContainer = document.getElementById('log-container');
    const trigger = document.getElementById('primary-trigger');
    const flash = document.getElementById('flash');
    
    let isLocked = false;
    let hasRedirected = false;
    let sequenceStarted = false;

    // CLINICAL FORENSIC LOGGING
    const writeLog = (message) => {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const timestamp = new Date().toISOString().substring(11, 23);
        entry.textContent = `[${timestamp}] ${message}`;
        logContainer.appendChild(entry);
    };

    // AUDIO: IGNITION EVENT
    const playMechanicalIgnition = () => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const t = ctx.currentTime;
        const master = ctx.createGain();
        master.connect(ctx.destination);
        master.gain.setValueAtTime(1, t);
        master.gain.exponentialRampToValueAtTime(0.01, t + 0.35);

        const sub = ctx.createOscillator();
        const subGain = ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(180, t);
        sub.frequency.exponentialRampToValueAtTime(20, t + 0.2);
        subGain.gain.setValueAtTime(1, t);
        subGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        sub.connect(subGain).connect(master);
        sub.start(t); sub.stop(t + 0.25);

        const relay = ctx.createOscillator();
        const relayGain = ctx.createGain();
        relay.type = 'square';
        relay.frequency.setValueAtTime(2000, t);
        relayGain.gain.setValueAtTime(0.5, t);
        relayGain.gain.setValueAtTime(0, t + 0.02);
        relayGain.gain.setValueAtTime(0.4, t + 0.04);
        relayGain.gain.setValueAtTime(0, t + 0.06);
        relay.connect(relayGain).connect(master);
        relay.start(t); relay.stop(t + 0.1);

        const bufferSize = ctx.sampleRate * 0.2; 
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.value = 1000;
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.7, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        noise.connect(noiseFilter).connect(noiseGain).connect(master);
        noise.start(t);
    };

    // DIGITAL DECRYPTION SEQUENCE
    const startDecryptionSequence = () => {
        if (sequenceStarted) return;
        sequenceStarted = true;
        
        body.setAttribute('data-state', 'UNLOCKED');
        writeLog('OBSERVER RETURNED. DECRYPTING DIRECTORIES.');
        
        const tiers = document.querySelectorAll('.nav-tier');
        
        // Strict Delay Matrix (milliseconds) mapping indices 0 through 6
        const delays = [0, 500, 1000, 1500, 2000, 2000, 2000];

        tiers.forEach((tier, index) => {
            const delay = delays[index] !== undefined ? delays[index] : 2000;
            setTimeout(() => {
                tier.classList.add('revealed');
            }, delay);
        });
    };

    // INTERCEPT RETURN FROM REDIRECT
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'visible' && hasRedirected) {
            startDecryptionSequence();
        }
    });

    // TIMELINE: ENVIRONMENTAL STATE PROGRESSION
    const timeline = {
        init: () => {
            body.setAttribute('data-state', 'DORMANT');
            
            setTimeout(() => {
                body.setAttribute('data-state', 'OBSERVED');
                writeLog('PRESENCE DETECTED');
                
                setTimeout(() => {
                    if (!isLocked) {
                        body.setAttribute('data-state', 'ACKNOWLEDGED');
                        writeLog('OBSERVER LOGGED');
                    }
                }, 10000); 

            }, 2000); 
        },

        executeThreshold: () => {
            if (isLocked) return;
            isLocked = true;

            body.setAttribute('data-state', 'THRESHOLD');
            writeLog('TRANSMISSION ARCHIVED');
            
            playMechanicalIgnition();
            flash.classList.add('trigger');
            trigger.style.pointerEvents = 'none';
            
            if(typeof gtag === 'function') {
                gtag('event', 'retrieve_file_click', {'event_category': 'funnel', 'event_label': 'polaroid_tap'});
            }
            
            setTimeout(() => {
                window.open('https://snd.click/0ifi', '_blank', 'noopener,noreferrer');
                body.setAttribute('data-state', 'REDIRECTING');
                writeLog('EXTRACTION INITIATED');
                hasRedirected = true;

                // Edge case fallback
                setTimeout(() => {
                    if (document.visibilityState === 'visible' && !sequenceStarted) {
                        startDecryptionSequence();
                    }
                }, 2000);

            }, 800); 
        }
    };

    trigger.addEventListener('click', timeline.executeThreshold);
    timeline.init();
});
</script>
