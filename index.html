<style>
  /* Define custom LIBBY font matching your exact GitHub folder structure */
  @font-face {
      font-family: 'LIBBY';
      src: url('fonts/libby.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
  }

  /* Universal Box Sizing */
  * { 
      box-sizing: border-box; 
  }

  /* The Unbreakable Background */
  html {
      background-color: #030000;
      scroll-behavior: smooth;
  }

  body {
      background-color: #030000;
      color: #590000;
      /* Applied LIBBY font globally */
      font-family: 'LIBBY', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
  }

  /* --- Top Header & Dropdown Menu (Normal page flow, NOT fixed) --- */
  .top-header {
      position: relative;
      width: 100%;
      padding: 25px 0 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
  }

  /* Grid layout to guarantee the dot is mathematically dead center */
  .logo-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      width: 100%;
      pointer-events: none; /* Allows clicks to pass through to the hamburger menu */
      font-size: clamp(12px, 3.5vw, 19px); 
      letter-spacing: 0.1em;
      white-space: nowrap;
  }
  .logo-left { text-align: right; }
  .logo-dot { text-align: center; }
  .logo-right { text-align: left; }

  .hamburger-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #590000;
      z-index: 1001;
      background: none;
      border: none;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
  }

  .dropdown-menu {
      position: absolute;
      top: 100%; /* Drops down naturally below the header */
      right: 20px;
      background-color: #030000;
      border: 1px solid #590000;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      padding: 15px 30px;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 999;
      text-align: right;
  }
  .dropdown-menu.is-open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
  }
  .dropdown-menu a {
      color: #590000;
      text-decoration: none;
      font-size: 16px;
      margin: 10px 0;
      letter-spacing: 0.1em;
      transition: opacity 0.2s;
      text-transform: uppercase;
  }
  .dropdown-menu a:hover {
      opacity: 0.7;
  }

  /* Traditional Block Centering - Max tightened vertical spacing to fit mobile screen */
  .wrapper {
      max-width: 580px;
      margin: 0 auto;
      padding: 5px 20px 10px 20px;
      text-align: center;
  }
  
  .bio {
      font-family: 'LIBBY', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 5px 0; /* Crushed margin */
      word-wrap: break-word;
  }

  /* Targeting parentheses in the bio specifically to raise them in line with LIBBY font */
  .bio span.paren {
      display: inline-block;
      vertical-align: 0.15em; /* Adjusts them upward precisely */
  }

  /* Precise Desktop/Mobile Bio Wrapping & No Hanging Bullets */
  .m-break { display: none; }
  .d-bullet { display: inline; }
  
  @media (max-width: 580px) {
      .m-break { display: block; }
      .d-bullet { display: none; }
  }

  /* Split Rows for Social Icons */
  .social-row-container {
      margin-bottom: 5px; /* Crushed margin */
  }
  .social-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px; /* Uniform internal spacing untouched */
  }
  .social-row:last-child {
      margin-bottom: 0;
  }

  .social-icon {
      display: inline-block;
      color: #590000;
      padding: 6px;
      text-decoration: none;
      transition: transform 0.2s ease;
  }
  .social-icon:hover {
      transform: scale(1.1);
  }
  .social-icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      vertical-align: middle;
  }

  /* The Legendary PNG Mask Trick */
  .png-mask {
      width: 28px;
      height: 28px;
      background-color: currentColor; /* Inherits the red color! */
      -webkit-mask-size: contain;
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-size: contain;
      mask-position: center;
      mask-repeat: no-repeat;
      display: inline-block;
      vertical-align: middle;
  }

  /* Main Links */
  .links-wrapper {
      display: block;
      width: 100%;
  }

  /* Hollow Rounded Button for EPK */
  .btn-rounded {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #590000;
      color: #590000;
      background-color: transparent;
      padding: 14px 60px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
      margin-top: 0px; 
      margin-bottom: 10px;
  }
  .btn-rounded:hover {
      background-color: #590000;
      color: #000000;
  }

  /* Polaroid Featured Layout - Narrowed to fit on one screen */
  .layout-featured {
      padding: 10px; /* Equal 10px border on top, bottom, left, and right */
      background-color: #590000;
      margin: 0 auto 5px auto; /* Centered, crushed bottom margin */
      display: block;
      text-decoration: none;
      width: 100%;
      max-width: 308px; /* Matches the exact width of the 8-icon social rows */
      transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .layout-featured:hover {
      transform: scale(1.02);
      opacity: 0.95;
  }
  .layout-featured .thumb {
      width: 100%;
      height: auto;
      aspect-ratio: 1/1; /* Perfect 1:1 Square */
      object-fit: contain; /* Prevents image from being cropped */
      margin-bottom: 12px;
      display: block;
  }
  .layout-featured .title {
      font-family: 'LIBBY', sans-serif;
      font-size: 21px; /* Scaled down from 26px to force single line */
      color: #000000; /* Black text on the red Polaroid border */
      letter-spacing: 0.05em;
      display: block;
      padding: 0;
      line-height: 1; /* Keeps the chin tight around the text */
      margin-bottom: 6px; /* Small gap between the main title and subtitle */
      white-space: nowrap; /* Bulletproof single line forcing */
  }
  .layout-featured .subtitle {
      font-family: 'LIBBY', sans-serif;
      font-size: 9px; /* Scaled down to stay on exactly one line */
      color: #000000; 
      letter-spacing: 0.02em; /* Tightened spacing */
      display: block;
      padding: 0;
      line-height: 1;
      white-space: nowrap; /* Bulletproof single line forcing */
  }
</style>
