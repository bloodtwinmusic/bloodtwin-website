<script>
    // --- MODULE: UTILITIES & SYSTEM CLOCK ---
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    let systemState = 'STANDBY';
    let polaroidClicked = false;
    let returnTrapTriggered = false;
    let visibilityPaused = false;
    
    // Core timeout/interval arrays for memory management on suspension
    let activeTimeouts = [];
    let activeIntervals = [];

    function _managedTimeout(fn, ms) {
        if(visibilityPaused) return; // Prevent scheduling if paused
        let id = setTimeout(() => {
            activeTimeouts = activeTimeouts.filter(t => t !== id);
            fn();
        }, ms);
        activeTimeouts.push(id);
        return id;
    }

    // --- MODULE: HARDWARE AUDIO SYNTHESIS ---
    const AudioSys = {
        ctx: null, master: null, 
        humBase: null, humH1: null, humH2: null, humGain: null,
        ambienceNoise: null, fanNoise: null, fanLFO: null, crackleNoise: null,
        noiseBuffer: null, sessionSeed: Math.random(),
        
        init() {
            if (this.ctx) return;
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.8;
            
            const compressor = this.ctx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-15, this.ctx.currentTime);
            compressor.knee.setValueAtTime(10, this.ctx.currentTime);
            compressor.ratio.setValueAtTime(12, this.ctx.currentTime);
            compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
            compressor.release.setValueAtTime(0.25, this.ctx.currentTime);

            const dist = this.ctx.createWaveShaper();
            dist.curve = this._makeDistortionCurve(6);
            dist.oversample = '4x';
            
            this.master.connect(dist).connect(compressor).connect(this.ctx.destination);
            
            this.noiseBuffer = this._createNoiseBuffer();

            // Persistent Hum (Warmer, Heavier)
            this.humGain = this.ctx.createGain();
            this.humGain.gain.setValueAtTime(0, this.ctx.currentTime);
            
            this.humBase = this.ctx.createOscillator(); this.humBase.type = 'sine'; this.humBase.frequency.value = 50 + (this.sessionSeed * 0.5);
            this.humH1 = this.ctx.createOscillator(); this.humH1.type = 'sawtooth'; this.humH1.frequency.value = 100 + (this.sessionSeed * 1.0);
            this.humH2 = this.ctx.createOscillator(); this.humH2.type = 'triangle'; this.humH2.frequency.value = 150 + (this.sessionSeed * 1.5);
            
            const h1Gain = this.ctx.createGain(); h1Gain.gain.value = 0.4;
            const h2Gain = this.ctx.createGain(); h2Gain.gain.value = 0.1;
            
            // Replaced uniform LFO with a recursive drift for physical "sag"
            this._modulateHum();

            this.crackleNoise = this.ctx.createBufferSource();
            this.crackleNoise.buffer = this.noiseBuffer; this.crackleNoise.loop = true;
            const crackleFilter = this.ctx.createBiquadFilter(); crackleFilter.type = 'highpass'; crackleFilter.frequency.value = 6000;
            const crackleGain = this.ctx.createGain(); crackleGain.gain.value = 0.003;

            const humFilter = this.ctx.createBiquadFilter(); humFilter.type = 'lowpass'; humFilter.frequency.value = 220;

            this.humBase.connect(humFilter);
            this.humH1.connect(h1Gain).connect(humFilter);
            this.humH2.connect(h2Gain).connect(humFilter);
            this.crackleNoise.connect(crackleFilter).connect(crackleGain).connect(humFilter);

            humFilter.connect(this.humGain).connect(this.master);
            
            this.humBase.start(); this.humH1.start(); this.humH2.start(); this.crackleNoise.start();
        },

        _makeDistortionCurve(amount) {
            let k = amount, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180, i = 0, x;
            for ( ; i < n_samples; ++i ) {
                x = i * 2 / n_samples - 1;
                curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
            }
            return curve;
        },

        _createNoiseBuffer() {
            if (!this.ctx) return null;
            const bufferSize = this.ctx.sampleRate * 2.0; 
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            return buffer;
        },

        _modulateStatic() {
            if (!this.ctx || systemState === 'STANDBY' || visibilityPaused) return;
            
            if (this.ambienceFilter && this.ambienceGain) {
                const targetFreq = 100 + Math.random() * 400;
                const targetGain = 0.005 + Math.random() * 0.015;
                const rampTime = 0.05 + Math.random() * 0.2;
                
                this.ambienceFilter.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, rampTime);
                this.ambienceGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, rampTime);
            }
            
            _managedTimeout(() => this._modulateStatic(), 50 + Math.random() * 350);
        },

        _modulateHum() {
            if (!this.ctx || systemState === 'STANDBY' || visibilityPaused) return;
            
            if (this.humGain) {
                const isIdle = systemState === 'IDLE';
                const baseLevel = isIdle ? 0.02 : 0.08 + (this.sessionSeed * 0.02);
                const variance = baseLevel * (0.85 + Math.random() * 0.3); // Drift +/- 15%
                const rampTime = 0.5 + Math.random() * 2.5;
                
                this.humGain.gain.setTargetAtTime(variance, this.ctx.currentTime, rampTime);
            }
            
            _managedTimeout(() => this._modulateHum(), 1000 + Math.random() * 3000);
        },

        startAmbience() {
            if(!this.ctx || this.ambienceNoise) return;
            this.ambienceNoise = this.ctx.createBufferSource();
            this.ambienceNoise.buffer = this.noiseBuffer;
            this.ambienceNoise.loop = true;
            
            this.ambienceFilter = this.ctx.createBiquadFilter(); 
            this.ambienceFilter.type = 'lowpass'; 
            this.ambienceFilter.frequency.value = 300;
            
            this.ambienceGain = this.ctx.createGain(); 
            this.ambienceGain.gain.value = 0.01; 
            
            this.ambienceNoise.connect(this.ambienceFilter).connect(this.ambienceGain).connect(this.master);
            this.ambienceNoise.start();
            
            this._modulateStatic(); // Begin chaotic drift
        },

        startHum() {
            if(!this.ctx) return;
            const baseLevel = 0.08 + (this.sessionSeed * 0.02); 
            this.humGain.gain.setTargetAtTime(baseLevel, this.ctx.currentTime, 1.5);
            this._modulateHum();
        },

        startFan() {
            if(!this.ctx || this.fanNoise) return;
            this.fanNoise = this.ctx.createBufferSource();
            this.fanNoise.buffer = this.noiseBuffer; this.fanNoise.loop = true;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 350; filter.Q.value = 0.5;
            const gain = this.ctx.createGain(); gain.gain.value = 0.03;
            
            this.fanLFO = this.ctx.createOscillator(); this.fanLFO.type = 'sine'; this.fanLFO.frequency.value = 0.4 * (0.9 + Math.random() * 0.2); 
            const lfoGain = this.ctx.createGain(); lfoGain.gain.value = 0.008; 
            
            this.fanLFO.connect(lfoGain).connect(gain.gain);
            this.fanNoise.connect(filter).connect(gain).connect(this.master);
            this.fanNoise.start(); this.fanLFO.start();
        },

        setIdle(isIdle) {
            // Hum is handled dynamically by _modulateHum, this just forces a baseline drop if needed
            if(!this.humGain) return;
            if(isIdle) this.humGain.gain.setTargetAtTime(0.02, this.ctx.currentTime, 1.0);
        },

        playDegauss() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            const osc1 = this.ctx.createOscillator(); osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(120, t); osc1.frequency.exponentialRampToValueAtTime(30, t + 0.8);
            const osc2 = this.ctx.createOscillator(); osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(80, t); osc2.frequency.exponentialRampToValueAtTime(20, t + 0.6);
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(1.2, t + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
            osc1.connect(gain); osc2.connect(gain); gain.connect(this.master);
            osc1.start(t); osc1.stop(t + 1.5); osc2.start(t); osc2.stop(t + 1.5);
        },

        playPowerBuzz() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, t);
            const lfo = this.ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.setValueAtTime(25, t);
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.15, t + 0.1); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
            const lfoGain = this.ctx.createGain(); lfoGain.gain.value = 0.8; lfo.connect(lfoGain.gain);
            const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.setValueAtTime(400, t);
            osc.connect(filter).connect(gain).connect(this.master);
            osc.start(t); osc.stop(t + 1.0); lfo.start(t); lfo.stop(t + 1.0);
        },

        playHDDSpinUp() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            
            // The Strain & Recovery Narrative
            const osc = this.ctx.createOscillator(); osc.type = 'triangle';
            osc.frequency.setValueAtTime(20, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 1.2); // Spin up
            osc.frequency.exponentialRampToValueAtTime(35, t + 1.6); // Struggle/Drop
            osc.frequency.exponentialRampToValueAtTime(120, t + 3.2); // Recover
            osc.frequency.linearRampToValueAtTime(120, t + 4.5); // Stabilize

            const whine = this.ctx.createOscillator(); whine.type = 'sawtooth';
            whine.frequency.setValueAtTime(40, t);
            whine.frequency.exponentialRampToValueAtTime(160, t + 1.2);
            whine.frequency.exponentialRampToValueAtTime(70, t + 1.6); // Struggle
            whine.frequency.exponentialRampToValueAtTime(240, t + 3.2);

            const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
            filter.frequency.setValueAtTime(100, t); filter.frequency.linearRampToValueAtTime(800, t + 3.2);

            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.06, t + 1.0); gain.gain.linearRampToValueAtTime(0.06, t + 3.8);
            gain.gain.linearRampToValueAtTime(0, t + 4.5);

            osc.connect(filter); whine.connect(filter); filter.connect(gain).connect(this.master);
            osc.start(t); osc.stop(t + 4.5); whine.start(t); whine.stop(t + 4.5);
            
            // Visual Sync for the struggle at t+1.5s
            _managedTimeout(() => systemDisturbance(1.5), 1450);
        },

        playHDDRead() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator(); osc.type = 'triangle';
            osc.frequency.setValueAtTime(800 + Math.random()*400, t);
            
            const noise = this.ctx.createBufferSource(); noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 2000 + Math.random()*1000;
            
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.04 + Math.random()*0.03, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            
            osc.connect(gain); noise.connect(filter).connect(gain); gain.connect(this.master);
            osc.start(t); osc.stop(t + 0.06); noise.start(t); noise.stop(t + 0.06);
        },

        playHDDTick() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            const noise = this.ctx.createBufferSource(); noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 4000;
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.02, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.01);
            noise.connect(filter).connect(gain).connect(this.master);
            noise.start(t); noise.stop(t + 0.02);
        },

        playHDDSearch(bursts = 4) {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const actualBursts = bursts + Math.floor(Math.random() * 3);
            let timeOffset = 0;
            
            for(let i=0; i<actualBursts; i++) {
                _managedTimeout(() => this.playHDDRead(), timeOffset);
                timeOffset += (15 + Math.random() * 40); // Irregular hunt timing
            }
        },

        playScanner() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator(); osc.type = 'sawtooth';
            // Strained tracking curve
            osc.frequency.setValueAtTime(80, t); osc.frequency.linearRampToValueAtTime(100, t + 1.5);
            osc.frequency.linearRampToValueAtTime(90, t + 2.5); osc.frequency.linearRampToValueAtTime(110, t + 4.0);
            
            const lfo = this.ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 14; 
            const lfoGain = this.ctx.createGain(); lfoGain.gain.value = 35;
            lfo.connect(lfoGain).connect(osc.frequency);
            
            const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 600;
            
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.08, t + 0.2); gain.gain.setValueAtTime(0.08, t + 3.8);
            gain.gain.linearRampToValueAtTime(0, t + 4.2);
            
            osc.connect(filter).connect(gain).connect(this.master);
            lfo.start(t); osc.start(t); lfo.stop(t + 4.5); osc.stop(t + 4.5);
        },

        playBios() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator(); osc.type = 'square'; osc.frequency.setValueAtTime(850, this.ctx.currentTime);
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.0, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.03, this.ctx.currentTime + 0.01); gain.gain.setValueAtTime(0.0, this.ctx.currentTime + 0.1); 
            osc.connect(gain).connect(this.master);
            osc.start(); osc.stop(this.ctx.currentTime + 0.15);
        },

        playRelay(volume = 0.4) {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator(); osc.type = 'square';
            osc.frequency.setValueAtTime(130 + Math.random()*40, t); // Slight physical randomisation
            osc.frequency.exponentialRampToValueAtTime(10, t + 0.05);
            
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(volume, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            
            osc.connect(gain).connect(this.master);
            osc.start(t); osc.stop(t + 0.05);
        },

        playTerminalPing() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            
            // High pitched piezo electronic click (pip/tik)
            const osc = this.ctx.createOscillator(); osc.type = 'square';
            osc.frequency.setValueAtTime(3000 + Math.random()*800, t);
            
            const noise = this.ctx.createBufferSource(); noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 6000;
            
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.04, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.015); // extremely sharp decay
            
            osc.connect(gain); noise.connect(filter).connect(gain); gain.connect(this.master);
            osc.start(t); osc.stop(t + 0.02); noise.start(t); noise.stop(t + 0.02);
        },
        
        playCamera() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            
            // 0.0s: Button/Relay click
            this.playRelay(0.2);

            // 0.1s: Mirror Slap (Heavy transient)
            const slap = this.ctx.createBufferSource(); slap.buffer = this.noiseBuffer;
            const slapFilter = this.ctx.createBiquadFilter(); slapFilter.type = 'lowpass'; slapFilter.frequency.value = 1500;
            const slapGain = this.ctx.createGain(); slapGain.gain.setValueAtTime(0, t);
            slapGain.gain.setValueAtTime(0.9, t + 0.1); slapGain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            
            const thump = this.ctx.createOscillator(); thump.type = 'triangle';
            thump.frequency.setValueAtTime(100, t + 0.1); thump.frequency.exponentialRampToValueAtTime(20, t + 0.15);
            
            slap.connect(slapFilter).connect(slapGain).connect(this.master);
            thump.connect(slapGain);
            slap.start(t+0.1); slap.stop(t + 0.16); thump.start(t+0.1); thump.stop(t + 0.16);

            // 0.15s: Motor Whine (strained)
            const whine = this.ctx.createOscillator(); whine.type = 'sawtooth';
            whine.frequency.setValueAtTime(450, t + 0.15); whine.frequency.linearRampToValueAtTime(200, t + 0.8);
            const wFilter = this.ctx.createBiquadFilter(); wFilter.type = 'bandpass'; wFilter.frequency.value = 800;
            const wGain = this.ctx.createGain(); wGain.gain.setValueAtTime(0, t + 0.15);
            wGain.gain.linearRampToValueAtTime(0.1, t + 0.2); wGain.gain.linearRampToValueAtTime(0.01, t + 0.8);
            whine.connect(wFilter).connect(wGain).connect(this.master);
            whine.start(t + 0.15); whine.stop(t + 0.85);

            // 0.2s - 0.8s: Plastic Rollers
            const rollers = this.ctx.createBufferSource(); rollers.buffer = this.noiseBuffer; rollers.loop = true;
            const rFilter = this.ctx.createBiquadFilter(); rFilter.type = 'bandpass'; rFilter.frequency.value = 1200;
            const rLFO = this.ctx.createOscillator(); rLFO.type = 'square'; rLFO.frequency.value = 12;
            const rGain = this.ctx.createGain(); rGain.gain.setValueAtTime(0, t + 0.2);
            rGain.gain.linearRampToValueAtTime(0.15, t + 0.3); rGain.gain.linearRampToValueAtTime(0, t + 0.8);
            rLFO.connect(rGain.gain);
            rollers.connect(rFilter).connect(rGain).connect(this.master);
            rollers.start(t + 0.2); rollers.stop(t + 0.85); rLFO.start(t + 0.2); rLFO.stop(t + 0.85);

            // 0.85s: Final Latch
            setTimeout(() => { this.playRelay(0.4); }, 850);
        },

        playHoverArc() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(60, this.ctx.currentTime);
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
            osc.connect(gain).connect(this.master);
            osc.start(); osc.stop(this.ctx.currentTime + 0.2);
        }
    };

    // --- MODULE: TYPING ENGINE (With HDD Sync) ---
    function clearLine(elementId) {
        const el = document.getElementById(elementId);
        const cursor = document.getElementById('master-cursor');
        if (cursor && cursor.parentNode === el) document.getElementById('cursor-holder').appendChild(cursor);
        el.innerHTML = '';
    }

    async function mechanicalType(elementId, text, fadePrevId = null) {
        if(visibilityPaused) {
            // If tab is hidden mid-type, wait until it returns
            await new Promise(r => {
                const check = setInterval(() => { if(!visibilityPaused){ clearInterval(check); r(); } }, 100);
            });
        }
        
        const el = document.getElementById(elementId);
        const cursor = document.getElementById('master-cursor');
        
        if (fadePrevId) document.getElementById(fadePrevId).classList.add('faded');
        el.appendChild(cursor);
        
        let currentText = "";
        const textNode = document.createTextNode("");
        el.insertBefore(textNode, cursor);

        // Pre-fetch
        AudioSys.playHDDSearch(4);
        await sleep(150 + Math.random() * 200);

        let burstCount = 0;

        for (let i = 0; i < text.length; i++) {
            if(visibilityPaused) await new Promise(r => { const c = setInterval(() => { if(!visibilityPaused){ clearInterval(c); r(); } }, 100); });

            // Data fetch logic: sync HDD with words/pauses
            if (i === 0 || text[i-1] === ' ' || text[i-1] === '.') {
                AudioSys.playHDDSearch(1); // Small hunt per word
            }

            // Unpredictable processing hesitation
            if (Math.random() < 0.05) {
                const pauseDur = 250 + Math.random() * 400;
                AudioSys.playHDDSearch(2);
                await sleep(pauseDur);
            }

            if (burstCount > 0) {
                burstCount--;
                await sleep(10 + Math.random() * 20); // Faster electronic bursts
            } else {
                if (Math.random() < 0.4) burstCount = Math.floor(Math.random() * 6) + 1;
                await sleep(35 + Math.random() * 50);
            }

            // Occasional terminal correction
            if (Math.random() < 0.015 && /[a-zA-Z]/.test(text[i])) {
                const typo = String.fromCharCode(text[i].charCodeAt(0) + (Math.random() > 0.5 ? 1 : -1));
                currentText += typo; textNode.nodeValue = currentText;
                AudioSys.playTerminalPing();
                await sleep(100 + Math.random() * 50);
                
                currentText = currentText.slice(0, -1); textNode.nodeValue = currentText;
                AudioSys.playTerminalPing(); // correction ping
                await sleep(60 + Math.random() * 40);
            }

            currentText += text[i]; textNode.nodeValue = currentText;
            AudioSys.playTerminalPing();
        }
    }

    // --- MODULE: SYSTEM STATE & TRACKING ---
    function systemDisturbance(intensity = 1) {
        if(systemState !== 'ACTIVE' && systemState !== 'WAKING') return;
        document.body.classList.add('system-struggle');
        _managedTimeout(() => document.body.classList.remove('system-struggle'), 40 * intensity);
    }

    function triggerRandomEvents() {
        activeIntervals.push(setInterval(() => {
            if (systemState !== 'ACTIVE' || visibilityPaused) return;
            const rand = Math.random();
            
            // Micro-life: Idle HD ticks
            if (rand < 0.2) AudioSys.playHDDTick();
            
            if (rand < 0.01) { 
                AudioSys.playRelay(0.2); systemDisturbance(2);
            } else if (rand < 0.03) {
                document.body.classList.add('voltage-drop');
                _managedTimeout(() => document.body.classList.remove('voltage-drop'), 100 + Math.random() * 200);
            } else if (rand < 0.05) {
                AudioSys.playHDDSearch(2);
            } else if (rand < 0.06) {
                document.body.classList.add('cursor-glitch');
                _managedTimeout(() => document.body.classList.remove('cursor-glitch'), 50 + Math.random() * 80);
            }
        }, 1800));
    }

    let lastInteraction = Date.now();

    function resetIdle() {
        if(visibilityPaused) return;
        lastInteraction = Date.now();
        if (systemState === 'IDLE') {
            systemState = 'ACTIVE';
            document.body.classList.remove('idle-mode');
            AudioSys.setIdle(false);
        }
    }

    activeIntervals.push(setInterval(() => {
        if (systemState === 'ACTIVE' && !visibilityPaused && (Date.now() - lastInteraction > 20000)) {
            systemState = 'IDLE'; document.body.classList.add('idle-mode'); AudioSys.setIdle(true); 
        }
    }, 2000));

    document.addEventListener('mousemove', resetIdle, {passive: true});
    document.addEventListener('keydown', resetIdle, {passive: true});

    document.addEventListener('touchstart', (e) => {
        resetIdle();
        if(visibilityPaused) return;
        const trace = document.createElement('div');
        trace.className = 'touch-trace';
        trace.style.left = e.touches[0].clientX + 'px'; trace.style.top = e.touches[0].clientY + 'px';
        document.body.appendChild(trace);
        if(Math.random() < 0.2) systemDisturbance(1);
        _managedTimeout(() => trace.remove(), 1200);
    }, {passive: true});

    // --- MODULE: VISIBILITY SUSPENSION ---
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            visibilityPaused = true;
            if (AudioSys.ctx) AudioSys.ctx.suspend();
        } else {
            visibilityPaused = false;
            resetIdle();
            if (AudioSys.ctx) AudioSys.ctx.resume();
        }
    });

    // --- MODULE: SCRAMBLER ---
    const polaroidCta = document.getElementById('polaroid-cta');
    const retrieveText = document.getElementById('retrieve-text');
    const glyphs = '█▓▒░><\\/!@#$*&^';
    let scrambleInterval;

    function runScramble(element, targetString) {
        clearInterval(scrambleInterval);
        let iteration = 0; const maxIter = 15;
        
        scrambleInterval = setInterval(() => {
            if(visibilityPaused) return;
            element.innerText = targetString.split('').map((char) => {
                if(char === '[' || char === ']' || char === ' ') return char;
                if(Math.random() < (iteration / maxIter)) return char;
                return glyphs[Math.floor(Math.random() * glyphs.length)];
            }).join('');
            
            if(iteration >= maxIter) { clearInterval(scrambleInterval); element.innerText = targetString; }
            iteration++;
        }, 30);
    }

    if (polaroidCta && retrieveText) {
        polaroidCta.addEventListener('mouseenter', () => {
            if(systemState !== 'ACTIVE' || visibilityPaused) return;
            runScramble(retrieveText, '[LISTEN NOW]'); AudioSys.playHDDSearch(6); 
        });
        polaroidCta.addEventListener('mouseleave', () => {
            if(systemState !== 'ACTIVE' || visibilityPaused) return;
            runScramble(retrieveText, '[RETRIEVE FILE]');
        });
    }

        } else if (entropyRoll < 0.40) {

            const errors = [ { err: "[FILE HEADER CORRUPTED]", rec: "[RECOVERED]" }, { err: "[TRACK 0 READ ERROR]", rec: "[RETRYING...]" }, { err: "[CRC CHECKSUM FAILED]", rec: "[PARITY RESTORED]" } ];
            const glitch = errors[Math.floor(Math.random() * errors.length)];

        localStorage.setItem('bt_visit_count', (visitCount + 1).toString());
        
        await sleep(1200);
        
        // Extraction (Scanner)
        document.getElementById('line1').classList.add('faded');
        document.getElementById('polaroid-cta').classList.add('developing');
        AudioSys.playScanner(); 
        
        _managedTimeout(() => { document.getElementById('polaroid-cta').classList.add('developed-glitch'); }, 8000); 

        await sleep(2500); 
        
        // Link Population
        const tiers = document.querySelectorAll('.nav-tier');
        for (let tier of tiers) {
            AudioSys.playHDDSearch(2); tier.classList.add('revealed');
            await sleep(150 + Math.random() * 300); 
        }

        systemState = 'ACTIVE'; triggerRandomEvents();
    });

    // --- MODULE: THE THRESHOLD PROTOCOLS ---
    if(polaroidCta) {
        polaroidCta.addEventListener('click', (e) => {
            e.preventDefault(); 
            polaroidClicked = true; resetIdle();

            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1'; _managedTimeout(() => { flash.style.opacity = '0'; }, 80);
            
            AudioSys.playCamera();

            _managedTimeout(() => { window.open('https://snd.click/0ifi', '_blank'); }, 1200); // Allow mechanism to finish
        });
    }

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && polaroidClicked && !returnTrapTriggered) {
            returnTrapTriggered = true; resetIdle();
            
            document.getElementById('line1').classList.add('faded');
            document.getElementById('line2').classList.add('faded');
            AudioSys.playHDDSearch(8);
            
            const l1 = document.getElementById('line1'); const l2 = document.getElementById('line2');
            l1.classList.add('dissolve-out'); l2.classList.add('dissolve-out');
            
            _managedTimeout(async () => {
                l1.style.display = 'none'; l2.style.display = 'none';
                
                const l3 = document.getElementById('line3'); const l4 = document.getElementById('line4');
                l3.style.display = 'block'; l4.style.display = 'block';
                
                AudioSys.playRelay(0.5); systemDisturbance(2);
                
                await mechanicalType('line3', '[TERMINAL ENGAGED]');
                await sleep(600);
                
                await mechanicalType('line4', '[INITIATE : COMPLETE COLLECTION]', 'line3');
                l4.classList.add('bomb-flash-link'); 
                
            }, 1500); 
        }
    });

    const restartLinkHover = document.getElementById('restart-link');
    if (restartLinkHover) {
        restartLinkHover.addEventListener('mouseenter', () => {
            if(!visibilityPaused) AudioSys.playHDDSearch(2);
        });
    }

    const currentHour = new Date().getHours();
    const isDaylight = currentHour >= 6 && currentHour < 18;

    if (isDaylight && finalLink) {
        finalLink.href = "javascript:void(0);";
        finalLink.removeAttribute("target"); 
        
        finalLink.addEventListener("click", function(e) {
            e.preventDefault();
            AudioSys.playRelay(0.6); systemDisturbance(4); 
            
            this.innerHTML = "[ERROR // DAYLIGHT DETECTED]<br>[RETURN IN DARKNESS]";
            this.classList.remove('bomb-flash-link');
            this.classList.add('faded');
            this.style.animation = 'none'; this.style.textDecoration = 'none';
            this.style.pointerEvents = 'none'; this.style.whiteSpace = 'normal'; 
            this.style.height = 'auto'; this.style.lineHeight = '1.4'; 
            
            if(typeof gtag === 'function') gtag('event', 'daylight_rejection', {'event_category': 'funnel', 'event_label': 'spotify_block'});
        });
    }
</script>
</body>
</html>
