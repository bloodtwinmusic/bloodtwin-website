                <a href="mailto:contact@bloodtwin.com" class="social-icon" aria-label="Email"><svg viewBox="0 0 24 24"><path d="M4.30606 7.28017C4.14002 7.62375 4.06901 7.99473 4.03469 8.4148C3.99999 8.83953 3.99999 9.36401 4 10.0143V13.9857C3.99999 14.6359 3.99999 15.1604 4.03469 15.5852C4.07042 16.0225 4.14591 16.4066 4.32698 16.7619C4.6146 17.3264 5.07354 17.7854 5.63803 18.073C5.9934 18.2541 6.37752 18.3296 6.81483 18.3653C7.23955 18.4 7.76404 18.4 8.4143 18.4H15.5857C16.236 18.4 16.7605 18.4 17.1852 18.3653C17.6225 18.3296 18.0066 18.2541 18.362 18.073C18.9265 17.7854 19.3854 17.3264 19.673 16.7619C19.8541 16.4066 19.9296 16.0225 19.9653 15.5852C20 15.1604 20 14.6359 20 13.9857V10.0143C20 9.36401 20 8.83953 19.9653 8.4148C19.931 7.99473 19.86 7.62375 19.6939 7.28017L13.8997 12.0209C12.7946 12.9251 11.2054 12.9251 10.1003 12.0209L4.30606 7.28017Z"></path><path d="M18.9609 6.3295C18.7792 6.17262 18.5783 6.0372 18.362 5.92696C18.0066 5.74588 17.6225 5.6704 17.1852 5.63467C16.7605 5.59997 16.236 5.59997 15.5857 5.59998H8.41432C7.76406 5.59997 7.23955 5.59997 6.81483 5.63467C6.37752 5.6704 5.9934 5.74588 5.63803 5.92696C5.42166 6.0372 5.2208 6.17262 5.03915 6.3295L10.8602 11.0922C11.5232 11.6347 12.4768 11.6347 13.1398 11.0922L18.9609 6.3295Z"></path></svg></a>

        <div class="system-footer"></div>
        <div id="cursor-holder" style="display:none;"><div id="master-cursor" class="type-cursor"></div></div>
    </div>

<script>
    // --- MODULE: UTILITIES & SYSTEM CLOCK ---
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    let systemState = 'STANDBY';
    let polaroidClicked = false;
    let returnTrapTriggered = false;

    // --- MODULE: HARDWARE AUDIO SYNTHESIS ---
    const AudioSys = {
        ctx: null, master: null, humOsc: null, humGain: null,
        
        init() {
            if (this.ctx) return;
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.85;
            
            const compressor = this.ctx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-12, this.ctx.currentTime);
            compressor.knee.setValueAtTime(10, this.ctx.currentTime);
            compressor.ratio.setValueAtTime(12, this.ctx.currentTime);
            compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
            compressor.release.setValueAtTime(0.25, this.ctx.currentTime);

            // Subtle distortion for global grit
            const dist = this.ctx.createWaveShaper();
            dist.curve = this._makeDistortionCurve(10);
            dist.oversample = '4x';
            
            this.master.connect(dist).connect(compressor).connect(this.ctx.destination);
            
            this.humOsc = this.ctx.createOscillator();
            this.humOsc.type = 'sawtooth';
            this.humOsc.frequency.setValueAtTime(50, this.ctx.currentTime);
            
            this.humGain = this.ctx.createGain();
            this.humGain.gain.setValueAtTime(0, this.ctx.currentTime);
            
            const humFilter = this.ctx.createBiquadFilter();
            humFilter.type = 'lowpass';
            humFilter.frequency.setValueAtTime(120, this.ctx.currentTime);
            
            this.humOsc.connect(humFilter).connect(this.humGain).connect(this.master);
            this.humOsc.start();
        },

        _makeDistortionCurve(amount) {
            let k = amount, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180, i = 0, x;
            for ( ; i < n_samples; ++i ) {
                x = i * 2 / n_samples - 1;
                curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
            }
            return curve;
        },
        
        startHum() {
            if(!this.ctx) return;
            this.humGain.gain.setTargetAtTime(0.08, this.ctx.currentTime, 1.5);
        },

        setIdle(isIdle) {
            if(!this.humGain) return;
            this.humGain.gain.setTargetAtTime(isIdle ? 0.02 : 0.08, this.ctx.currentTime, 1.0);
        },

        playDegauss() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(90, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(15, this.ctx.currentTime + 0.6);
            
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(1.5, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
            
            osc.connect(gain).connect(this.master);
            osc.start(); osc.stop(this.ctx.currentTime + 0.6);
        },

        playPowerBuzz() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(50, this.ctx.currentTime);

            const lfo = this.ctx.createOscillator();
            lfo.type = 'square';
            lfo.frequency.setValueAtTime(25, this.ctx.currentTime);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.15, this.ctx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);

            const lfoGain = this.ctx.createGain();
            lfoGain.gain.value = 0.8;
            lfo.connect(lfoGain.gain);

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(400, this.ctx.currentTime);

            osc.connect(filter).connect(gain);
            gain.connect(this.master);

            osc.start(); osc.stop(this.ctx.currentTime + 1.0);
            lfo.start(); lfo.stop(this.ctx.currentTime + 1.0);
        },

        playScanner() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(130, this.ctx.currentTime + 0.3);
            osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.5);
            osc.frequency.linearRampToValueAtTime(140, this.ctx.currentTime + 0.9);
            
            const lfo = this.ctx.createOscillator();
            lfo.type = 'square';
            lfo.frequency.value = 12;
            
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.value = 40;
            lfo.connect(lfoGain).connect(osc.frequency);
            
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass'; filter.frequency.value = 600;
            
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.12, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime + 0.7);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.0);
            
            osc.connect(filter).connect(gain).connect(this.master);
            lfo.start(); osc.start();
            lfo.stop(this.ctx.currentTime + 1.1); osc.stop(this.ctx.currentTime + 1.1);
        },

        playHDDSpinUp() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(20, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 1.2);
            osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 2.0);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime + 0.5);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 2.0);

            osc.connect(gain).connect(this.master);
            osc.start(); osc.stop(this.ctx.currentTime + 2.0);
        },

        playBios() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.setValueAtTime(850, this.ctx.currentTime);

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 2000;
            
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
            
            osc.connect(filter).connect(gain).connect(this.master);
            osc.start(); osc.stop(this.ctx.currentTime + 0.12);
        },

        _createNoiseBuffer() {
            const bufferSize = this.ctx.sampleRate * 1.0;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            return buffer;
        },

        playHDD(isFailing = false) {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const bursts = isFailing ? (8 + Math.floor(Math.random() * 10)) : (4 + Math.floor(Math.random() * 5));
            for(let i=0; i<bursts; i++) {
                setTimeout(() => {
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = this._createNoiseBuffer();
                    
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = isFailing ? 'highpass' : 'bandpass';
                    filter.frequency.value = isFailing ? 4000 + Math.random() * 2000 : 1000 + Math.random() * 2000;
                    
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.1 + Math.random() * (isFailing ? 0.3 : 0.15), this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + (isFailing ? 0.05 : 0.02));
                    
                    noise.connect(filter).connect(gain).connect(this.master);
                    noise.start(); noise.stop(this.ctx.currentTime + 0.06);
                }, i * (isFailing ? 40 : 25) + Math.random() * 20);
            }
            if (isFailing) {
                setTimeout(() => this.playRelay(0.5), bursts * 40); 
            }
        },

        playRelay(volume = 0.4) {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.05);
            
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
            
            osc.connect(gain).connect(this.master);
            osc.start(); osc.stop(this.ctx.currentTime + 0.05);
        },

        playKeystroke() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.03);
            
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
            
            osc.connect(gain).connect(this.master);
            osc.start(); osc.stop(this.ctx.currentTime + 0.03);
        },
        
        playPolaroidInteraction() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const t = this.ctx.currentTime;
            
            // 1. Shutter snap
            const shutter = this.ctx.createBufferSource();
            shutter.buffer = this._createNoiseBuffer();
            const sFilter = this.ctx.createBiquadFilter();
            sFilter.type = 'highpass'; sFilter.frequency.value = 3000;
            const sGain = this.ctx.createGain();
            sGain.gain.setValueAtTime(0.5, t);
            sGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
            shutter.connect(sFilter).connect(sGain).connect(this.master);
            shutter.start(t); shutter.stop(t + 0.1);

            // 2. Relay clack
            this.playRelay(0.6);

            // 3. Motor Whir & Paper Scrape (Tape Hiss)
            const whir = this.ctx.createBufferSource();
            whir.buffer = this._createNoiseBuffer();
            const wFilter = this.ctx.createBiquadFilter();
            wFilter.type = 'bandpass';
            wFilter.frequency.setValueAtTime(400, t + 0.05);
            wFilter.frequency.linearRampToValueAtTime(1200, t + 0.5);
            const wGain = this.ctx.createGain();
            wGain.gain.setValueAtTime(0, t + 0.05);
            wGain.gain.linearRampToValueAtTime(0.15, t + 0.1);
            wGain.gain.linearRampToValueAtTime(0.05, t + 0.4);
            wGain.gain.exponentialRampToValueAtTime(0.01, t + 0.7);
            whir.connect(wFilter).connect(wGain).connect(this.master);
            whir.start(t + 0.05); whir.stop(t + 0.75);

            // 4. Final Latch
            setTimeout(() => { this.playRelay(0.5); }, 650);
        },

        playHoverArc() {
            if(!this.ctx || this.ctx.state === 'suspended') return;
            const osc = this.ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, this.ctx.currentTime);
            
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
            
            osc.connect(gain).connect(this.master);
            osc.start(); osc.stop(this.ctx.currentTime + 0.2);
        }
    };

    // --- MODULE: MECHANICAL TYPING ENGINE ---
    function clearLine(elementId) {
        const el = document.getElementById(elementId);
        const cursor = document.getElementById('master-cursor');
        if (cursor && cursor.parentNode === el) {
            document.getElementById('cursor-holder').appendChild(cursor);
        }
        el.innerHTML = '';
    }

    async function mechanicalType(elementId, text, fadePrevId = null) {
        const el = document.getElementById(elementId);
        const cursor = document.getElementById('master-cursor');
        
        if (fadePrevId) document.getElementById(fadePrevId).classList.add('faded');
        el.appendChild(cursor);
        
        let currentText = "";
        const textNode = document.createTextNode("");
        el.insertBefore(textNode, cursor);

        let burstCount = 0;

        for (let i = 0; i < text.length; i++) {
            if (Math.random() < 0.08) await sleep(100 + Math.random() * 300);

            if (burstCount > 0) {
                burstCount--;
                await sleep(15 + Math.random() * 25);
            } else {
                if (Math.random() < 0.3) burstCount = Math.floor(Math.random() * 4) + 1;
                await sleep(45 + Math.random() * 65);
            }

            // Destructive backspace mis-strike logic
            if (Math.random() < 0.015 && /[a-zA-Z]/.test(text[i])) {
                const typo = String.fromCharCode(text[i].charCodeAt(0) + (Math.random() > 0.5 ? 1 : -1));
                currentText += typo; textNode.nodeValue = currentText;
                AudioSys.playKeystroke();
                await sleep(80 + Math.random() * 60);
                
                currentText = currentText.slice(0, -1); textNode.nodeValue = currentText;
                AudioSys.playRelay(0.12);
                await sleep(60 + Math.random() * 40);
            }

            currentText += text[i]; textNode.nodeValue = currentText;
            AudioSys.playKeystroke();
        }
    }

    // --- MODULE: HARDWARE EFFECTS & INTERCONNECTIVITY ---
    function systemDisturbance(intensity = 1) {
        if(systemState !== 'ACTIVE' && systemState !== 'WAKING') return;
        document.body.classList.add('disturbance');
        setTimeout(() => document.body.classList.remove('disturbance'), 40 * intensity);
    }

    function triggerRandomEvents() {
        setInterval(() => {
            if (systemState !== 'ACTIVE') return;
            const rand = Math.random();
            
            if (rand < 0.015) { 
                AudioSys.playRelay(0.3); systemDisturbance(3);
            } else if (rand < 0.04) {
                document.body.classList.add('voltage-drop');
                setTimeout(() => document.body.classList.remove('voltage-drop'), 100 + Math.random() * 300);
            } else if (rand < 0.07) {
                AudioSys.playHDD();
            } else if (rand < 0.08) {
                document.body.classList.add('cursor-glitch');
                setTimeout(() => document.body.classList.remove('cursor-glitch'), 50 + Math.random() * 100);
            }
        }, 1500);
    }

    // --- MODULE: PERIPHERAL TRACKING & IDLE ---
    let lastInteraction = Date.now();

    function resetIdle() {
        lastInteraction = Date.now();
        if (systemState === 'IDLE') {
            systemState = 'ACTIVE';
            document.body.classList.remove('idle-mode');
            AudioSys.setIdle(false);
        }
    }

    setInterval(() => {
        if (systemState === 'ACTIVE' && (Date.now() - lastInteraction > 20000)) {
            systemState = 'IDLE'; document.body.classList.add('idle-mode'); AudioSys.setIdle(true); 
        }
    }, 2000);

    document.addEventListener('mousemove', () => resetIdle(), {passive: true});
    document.addEventListener('keydown', () => resetIdle(), {passive: true});

    document.addEventListener('touchstart', (e) => {
        resetIdle();
        const trace = document.createElement('div');
        trace.className = 'touch-trace';
        trace.style.left = e.touches[0].clientX + 'px'; trace.style.top = e.touches[0].clientY + 'px';
        document.body.appendChild(trace);
        if(Math.random() < 0.3) systemDisturbance(1);
        setTimeout(() => trace.remove(), 1200);
    }, {passive: true});

    // --- MODULE: HOVER TACTILITY & SCRAMBLER ---
    const polaroidCta = document.getElementById('polaroid-cta');
    const retrieveText = document.getElementById('retrieve-text');
    const glyphs = '█▓▒░><\\/!@#$*&^';
    let scrambleInterval;

    function runScramble(element, targetString) {
        clearInterval(scrambleInterval);
        let iteration = 0;
        const maxIter = 15;
        
        scrambleInterval = setInterval(() => {
            element.innerText = targetString.split('').map((char) => {
                if(char === '[' || char === ']') return char;
                if(char === ' ') return ' ';
                if(Math.random() < (iteration / maxIter)) return char;
                return glyphs[Math.floor(Math.random() * glyphs.length)];
            }).join('');
            
            if(iteration >= maxIter) {
                clearInterval(scrambleInterval);
                element.innerText = targetString;
            }
            iteration++;
        }, 30);
    }

    if (polaroidCta && retrieveText) {
        polaroidCta.addEventListener('mouseenter', () => {
            if(systemState !== 'ACTIVE') return;
            runScramble(retrieveText, '[LISTEN NOW]');
            AudioSys.playHDD(); 
        });
        polaroidCta.addEventListener('mouseleave', () => {
            if(systemState !== 'ACTIVE') return;
            runScramble(retrieveText, '[RETRIEVE FILE]');
        });
    }

    const finalLink = document.getElementById('line4');
    finalLink.addEventListener('mouseenter', () => {
        if(finalLink.classList.contains('bomb-flash-link')) AudioSys.playHoverArc();
    });

    // --- MODULE: SYSTEM BOOT CONTROLLER & TELEMETRY ---
    const terminalMessages = [
        "OBSERVER LOGGED", "PREVIOUS ACCESS DETECTED", "CACHE RECORD FOUND",
        "YOU CAME BACK", "I KNEW YOU WOULD BE BACK", "YOU ALWAYS COME BACK",
        "WELCOME BACK", "NOT FINISHED YET?", "STILL HERE?",
        "THIS FREQUENCY IS MONITORED", "OBSERVATION ACTIVE", "TRANSMISSION CONTINUES",
        "THE SIGNAL PERSISTS", "SIGNAL REMAINS STABLE", "ARCHIVE STILL INTACT",
        "MEMORY PRESERVED", "SENTIENCE: UNCONFIRMED", "HUMAN STATUS: UNVERIFIED",
        "CONSCIOUSNESS: UNVERIFIED", "SOURCE UNCHANGED", "NO ERRORS DETECTED",
        "INACTION DETECTED", "OBSERVATION REQUIRES PARTICIPATION", "PASSIVITY OBSERVED",
        "GOOD TO SEE YOU AGAIN"
    ];

    setTimeout(() => { document.getElementById('standby-text').style.opacity = 1; }, 1000);

    document.getElementById('standby-overlay').addEventListener('click', async () => {
        if (systemState !== 'STANDBY') return;
        systemState = 'WAKING';
        
        AudioSys.init();
        if (AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
        
        // 1. Core Hardware Activation
        AudioSys.playRelay(0.6); 
        setTimeout(() => AudioSys.playDegauss(), 50);
        setTimeout(() => AudioSys.playPowerBuzz(), 150);
        
        const standby = document.getElementById('standby-overlay');
        standby.style.opacity = 0; setTimeout(() => standby.remove(), 800);
        
        await sleep(450);
        document.getElementById('system-container').classList.add('booting');
        document.body.classList.add('powered'); 
        AudioSys.startHum();
        
        await sleep(500);
        document.getElementById('status-led').classList.add('powered');
        
        AudioSys.playScanner();
        setTimeout(() => AudioSys.playHDDSpinUp(), 200);
        
        await sleep(1000 + Math.random() * 400);
        AudioSys.playHDD();
        await sleep(400);

        // 2. Audio Diagnostics
        await mechanicalType('line1', '[SYSTEM AUDIO: AVAILABLE]');
        await sleep(400 + Math.random() * 400);

        // 3. System Entropy / Hardware Flaws (35% probability)
        if (Math.random() < 0.35) {
            const errors = [
                { err: "[FILE HEADER CORRUPTED]", rec: "[RECOVERED]" },
                { err: "[TRACK 0 READ ERROR]", rec: "[RETRYING...]" },
                { err: "[CRC CHECKSUM FAILED]", rec: "[PARITY RESTORED]" }
            ];
            const glitch = errors[Math.floor(Math.random() * errors.length)];

            AudioSys.playRelay(0.3);
            await mechanicalType('line2', glitch.err, null);
            systemDisturbance(2);
            AudioSys.playHDD(true);
            await sleep(800 + Math.random() * 800);

            clearLine('line2');
            AudioSys.playRelay(0.2);
            await mechanicalType('line2', glitch.rec, null);
            await sleep(500 + Math.random() * 400);
        }

        AudioSys.playBios();
        await sleep(300);

        // 4. Primary OS Boot & Telemetry Memory
        clearLine('line1');
        clearLine('line2');
        document.getElementById('line1').classList.remove('faded');
        document.getElementById('line2').classList.remove('faded');
        await sleep(200);

        let visitCount = parseInt(localStorage.getItem('bt_visit_count') || '0', 10);
        let msgIndex = visitCount;
        
        if (msgIndex >= terminalMessages.length) {
            const bias = 1 - Math.pow(Math.random(), 2); 
            msgIndex = 10 + Math.floor(bias * 15);
            if(msgIndex > 24) msgIndex = 24;
        }

        await mechanicalType('line1', '[SYS. V0.01 // WAKING]');
        await sleep(500);
        
        AudioSys.playRelay(0.4); systemDisturbance(2);
        
        await mechanicalType('line2', `[${terminalMessages[msgIndex]}]`, 'line1');
        
        localStorage.setItem('bt_visit_count', (visitCount + 1).toString());
        
        await sleep(1000);
        
        document.getElementById('line2').classList.remove('faded');
        document.getElementById('polaroid-cta').classList.add('developing');
        
        setTimeout(() => {
            document.getElementById('polaroid-cta').classList.add('developed-glitch');
        }, 8000); 

        await sleep(2500); 
        const tiers = document.querySelectorAll('.nav-tier');
        for (let tier of tiers) {
            AudioSys.playHDD();
            tier.classList.add('revealed');
            await sleep(200 + Math.random() * 400); 
        }

        systemState = 'ACTIVE';
        triggerRandomEvents();
    });

    // --- MODULE: THE THRESHOLD PROTOCOLS ---
    if(polaroidCta) {
        polaroidCta.addEventListener('click', (e) => {
            e.preventDefault(); 
            polaroidClicked = true; resetIdle();

            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1'; setTimeout(() => { flash.style.opacity = '0'; }, 80);
            
            AudioSys.playPolaroidInteraction();

            setTimeout(() => { window.open('https://snd.click/0ifi', '_blank'); }, 120);
        });
    }

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && polaroidClicked && !returnTrapTriggered) {
            returnTrapTriggered = true; resetIdle();
            
            document.getElementById('line2').classList.add('faded');
            AudioSys.playHDD();
            
            const l1 = document.getElementById('line1'); const l2 = document.getElementById('line2');
            l1.classList.add('dissolve-out'); l2.classList.add('dissolve-out');
            
            setTimeout(async () => {
                l1.style.display = 'none'; l2.style.display = 'none';
                
                const l3 = document.getElementById('line3'); const l4 = document.getElementById('line4');
                l3.style.display = 'block'; l4.style.display = 'block';
                
                AudioSys.playRelay(0.5); systemDisturbance(2);
                
                await mechanicalType('line3', '[TERMINAL ENGAGED]');
                await sleep(500);
                
                await mechanicalType('line4', '[INITIATE : COMPLETE COLLECTION]', 'line3');
                l4.classList.add('bomb-flash-link'); 
                
            }, 1500); 
        }
    });

    const currentHour = new Date().getHours();
    const isDaylight = currentHour >= 6 && currentHour < 18;

    if (isDaylight && finalLink) {
        finalLink.href = "javascript:void(0);";
        finalLink.removeAttribute("target"); 
        
        finalLink.addEventListener("click", function(e) {
            e.preventDefault();
            AudioSys.playRelay(0.6); systemDisturbance(4); 
            
            this.innerHTML = "[ERROR // DAYLIGHT DETECTED]<br>[RETURN IN DARKNESS]";
            this.classList.remove('bomb-flash-link');
            this.classList.add('faded');
            this.style.animation = 'none'; this.style.textDecoration = 'none';
            this.style.pointerEvents = 'none'; this.style.whiteSpace = 'normal'; 
            this.style.height = 'auto'; this.style.lineHeight = '1.4'; 
            
            if(typeof gtag === 'function') gtag('event', 'daylight_rejection', {'event_category': 'funnel', 'event_label': 'spotify_block'});
        });
    }
</script>
